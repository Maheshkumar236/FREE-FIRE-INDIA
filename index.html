<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            Object.defineProperty(window, 'fetch', {
              value: origFetch.bind(window),
              writable: true,
              configurable: true,
            });
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (desc && !desc.writable && !desc.set) {
              Object.defineProperty(Window.prototype, 'fetch', {
                value: origFetch,
                writable: true,
                configurable: true,
              });
            }
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              file.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = String((event && event.reason) || '');
            if (
              reason.indexOf('chrome-extension://') !== -1 ||
              reason.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELITESTAR - Ultimate Esports &amp; LAN Tournament Platform</title>

  </head>

  </body>
</html>
